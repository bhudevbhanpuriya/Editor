server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed filenames, so these can never go stale.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must not be cached, or a deploy leaves clients pointed at
    # asset filenames that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # react-router handles the routes; anything not on disk is the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
